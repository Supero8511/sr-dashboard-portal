name: update-cbank
on:
  schedule:
    - cron: '15 */6 * * *'   # 6시간마다(하루 4회) — 회의 결과 확정 여부를 확인
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pypdf
      - name: update cbank.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/update_cbank.py
      - name: commit
        run: |
          git config user.name sr-bot && git config user.email bot@users.noreply.github.com
          git add docs/cbank.js
          git diff --cached --quiet || git commit -m "cbank auto-update $(date +%F)"
          git push
