<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>슈페로의 경제지표 포털</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#f4f6f9;color:#1a2230;
  font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}
a{color:#1f5fd6;text-decoration:none}

.bg-orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none}
.bg-orb.a{width:420px;height:420px;top:-160px;left:-120px;background:#1f5fd6}
.bg-orb.b{width:380px;height:380px;bottom:-140px;right:-100px;background:#8e1f30}

.landing{
  position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:60px 22px 40px;max-width:720px;margin:0 auto;width:100%;
}
.eyebrow{
  font-size:12.5px;font-weight:700;letter-spacing:.6px;color:#5b6776;
  background:#fff;border:1px solid #e3e8ef;border-radius:999px;padding:6px 16px;margin-bottom:22px;
  box-shadow:0 1px 2px rgba(20,30,50,.04);
}
h1{
  font-size:2.3rem;line-height:1.3;letter-spacing:-0.5px;margin:0 0 26px;
}
h1 .accent{color:#1f5fd6}

.quote{
  position:relative;margin:6px 0 34px;padding:26px 30px;
  background:#fff;border:1px solid #e3e8ef;border-radius:16px;
  box-shadow:0 1px 3px rgba(20,30,50,.05);
  font-size:1.08rem;line-height:1.85;color:#34404e;font-weight:600;
  letter-spacing:-0.2px;
}
.quote::before{content:'“';font-size:2.4rem;color:#dbe4f0;font-weight:800;position:absolute;top:2px;left:16px;line-height:1}
.quote::after{content:'”';font-size:2.4rem;color:#dbe4f0;font-weight:800;position:absolute;bottom:-14px;right:16px;line-height:1}
.quote span{position:relative;z-index:1}

.enter-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:15.5px;font-weight:700;color:#fff;background:#1f5fd6;
  border-radius:999px;padding:14px 30px;box-shadow:0 4px 14px rgba(31,95,214,.28);
  transition:transform .12s ease,box-shadow .12s ease;
}
.enter-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(31,95,214,.35)}
.enter-btn .arrow{transition:transform .12s ease}
.enter-btn:hover .arrow{transform:translateX(3px)}

.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.tile{
  font-size:12.5px;font-weight:600;color:#5b6776;background:#fff;
  border:1px solid #e3e8ef;border-radius:10px;padding:8px 14px;
}

.portal-footer{
  position:relative;z-index:1;max-width:720px;margin:0 auto;width:100%;
  padding:22px 22px 34px;text-align:center;
}
.contact-title{
  font-size:12px;font-weight:700;letter-spacing:.4px;color:#97a2b1;
  margin-bottom:12px;
}
.contact-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.contact-links a{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:#44505f;background:#fff;
  border:1px solid #e3e8ef;border-radius:999px;padding:8px 16px;
  box-shadow:0 1px 2px rgba(20,30,50,.04);
}
.contact-links a:hover{border-color:#1f5fd6;color:#1f5fd6}
.contact-links a:hover .url{color:#1f5fd6}
.contact-links .dot{width:7px;height:7px;border-radius:50%;flex:none}
.contact-links .label{font-weight:700}
.contact-links .url{font-weight:500;color:#8994a3;font-size:12px}
.disclaimer{margin-top:18px;font-size:11.5px;color:#b4bdc9;line-height:1.7}
</style>
</head><body>

<div class="bg-orb a"></div>
<div class="bg-orb b"></div>

<div class="landing">
  <div class="eyebrow">SR지수 · 경제지표 통합 포털</div>
  <h1>슈페로의 <span class="accent">경제지표 포털</span></h1>

  <div class="quote"><span>진정한 투자자란 누군가에게 기대지 않고 홀로서는 자다</span></div>

  <a class="enter-btn" href="dashboard.html">
    포털 입장하기 <span class="arrow">→</span>
  </a>

  <div class="tiles">
    <div class="tile">SR 생활비지수</div>
    <div class="tile">물가·통화</div>
    <div class="tile">고용</div>
    <div class="tile">경기·심리</div>
    <div class="tile">PCE 확산 지표</div>
    <div class="tile">통화정책 일정</div>
  </div>
</div>

<div class="portal-footer">
  <div class="contact-title">문의</div>
  <div class="contact-links">
    <a href="https://blog.naver.com/supero_" target="_blank" rel="noopener">
      <span class="dot" style="background:#03c75a"></span><span class="label">블로그</span><span class="url">blog.naver.com/supero_</span>
    </a>
    <a href="https://www.threads.com/@supero8511" target="_blank" rel="noopener">
      <span class="dot" style="background:#1a2230"></span><span class="label">스레드</span><span class="url">threads.com/@supero8511</span>
    </a>
  </div>
  <div class="disclaimer">본 포털은 개인 연구용 가공 지표를 포함하며 공식 통계가 아닙니다.</div>
</div>

</body></html>
